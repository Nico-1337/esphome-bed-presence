<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Four half-bridge load cells wired as one bridge</title>
  <rect x="1" y="1" width="898" height="638" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="40" y="48" font-size="22" font-weight="700" fill="#1f2328">Four bathroom-scale cells, one under each leg</text>
  <text x="40" y="74" font-size="15" fill="#57606a">Seen from above. Each cell has two outer wires and one centre wire (colours vary: measure them).</text>

  <!-- Bed outline -->
  <rect x="150" y="110" width="440" height="460" rx="18" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="370" y="140" font-size="14" text-anchor="middle" fill="#8c959f">bed (head)</text>

  <!-- Ring of outer wires -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M214 170 L526 170" stroke="#1f2328"/>
    <path d="M556 200 L556 480" stroke="#8c959f"/>
    <path d="M526 510 L214 510" stroke="#1f2328"/>
    <path d="M184 480 L184 200" stroke="#8c959f"/>
  </g>
  <g font-size="13" fill="#57606a">
    <text x="370" y="160" text-anchor="middle">black ↔ black</text>
    <text x="370" y="532" text-anchor="middle">black ↔ black</text>
    <text x="544" y="345" text-anchor="end">white ↔ white</text>
    <text x="196" y="345">white ↔ white</text>
  </g>

  <!-- Centre wires to the HX711 -->
  <g fill="none" stroke-width="5" stroke-linecap="round" stroke="#cf222e">
    <path d="M200 186 C 260 250, 300 290, 322 300"/>
    <path d="M540 186 C 480 250, 440 290, 418 300"/>
    <path d="M540 494 C 480 430, 440 390, 418 380"/>
    <path d="M200 494 C 260 430, 300 390, 322 380"/>
  </g>

  <!-- HX711 -->
  <rect x="310" y="290" width="120" height="100" rx="8" fill="#1f7a4d" stroke="#14532d" stroke-width="2"/>
  <text x="370" y="345" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">HX711</text>
  <g font-size="13" font-weight="700" fill="#ffffff">
    <circle cx="322" cy="300" r="6" fill="#e3b341"/><text x="332" y="315">E+</text>
    <circle cx="418" cy="300" r="6" fill="#e3b341"/><text x="408" y="315" text-anchor="end">A+</text>
    <circle cx="418" cy="380" r="6" fill="#e3b341"/><text x="408" y="376" text-anchor="end">E−</text>
    <circle cx="322" cy="380" r="6" fill="#e3b341"/><text x="332" y="376">A−</text>
  </g>

  <!-- Cells -->
  <g stroke="#6e7781" stroke-width="2">
    <rect x="166" y="152" width="36" height="36" rx="8" fill="#dfe3e8"/>
    <rect x="538" y="152" width="36" height="36" rx="8" fill="#dfe3e8"/>
    <rect x="538" y="492" width="36" height="36" rx="8" fill="#dfe3e8"/>
    <rect x="166" y="492" width="36" height="36" rx="8" fill="#dfe3e8"/>
  </g>
  <g fill="#cf222e"><circle cx="184" cy="170" r="5"/><circle cx="556" cy="170" r="5"/><circle cx="556" cy="510" r="5"/><circle cx="184" cy="510" r="5"/></g>

  <!-- Legend -->
  <g font-size="15" fill="#1f2328">
    <text x="640" y="200" font-weight="700">Rules</text>
    <text x="640" y="232">1. Outer wires form a ring,</text>
    <text x="640" y="252">   same colour to same colour.</text>
    <text x="640" y="284">2. Centre wires of two</text>
    <text x="640" y="304">   diagonal cells: E+ and E−.</text>
    <text x="640" y="336">3. Centre wires of the other</text>
    <text x="640" y="356">   two: A+ and A−.</text>
    <text x="640" y="400" fill="#57606a">Easier: a "load cell</text>
    <text x="640" y="420" fill="#57606a">combinator" board does</text>
    <text x="640" y="440" fill="#57606a">this wiring for you.</text>
  </g>
  <g font-size="14" fill="#57606a">
    <line x1="640" y1="488" x2="676" y2="488" stroke="#cf222e" stroke-width="5"/><text x="686" y="493">centre wire</text>
    <line x1="640" y1="514" x2="676" y2="514" stroke="#1f2328" stroke-width="5"/><text x="686" y="519">outer wire</text>
    <line x1="640" y1="540" x2="676" y2="540" stroke="#8c959f" stroke-width="5"/><text x="686" y="545">other outer wire</text>
  </g>
  <text x="370" y="604" font-size="14" text-anchor="middle" fill="#8c959f">The HX711 then connects to the NodeMCU as in the one-cell diagram.</text>
</svg>
